# Default locale fallback for message/modal resources: a Discord locale (case-sensitive) that has a
# lang/<locale>/ directory. Users whose locale has no lang files get English texts (Chinese ones for
# Chinese locales), and texts missing there come from this locale.
defaultLocale: "zh-TW"

# Interval (in seconds) for auto-draw polling, from 5 to 3600 (other values are clamped).
# Lower values increase server load when there are many guilds/giveaways.
autoDrawIntervalSeconds: 60

# The time zone of the end times that administrators type and see, such as "Asia/Taipei".
# Empty: the host's time zone (in Docker, UTC unless the container's TZ is set).
timeZone: ""
