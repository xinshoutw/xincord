# The markers of a flattened thread in the archive (Ticket.kt:719-746), in the default locale.
archive:
  start: "【Thread 開始】\n作者: %tt@owner%\n名稱: %tt@name%\n開始時間: %tt@time%"
  end: "【Thread 結束】\n作者: %tt@owner%\n名稱: %tt@name%\n最後一則訊息時間: %tt@time%"
  error: "【Thread 攤平失敗】\n作者: %tt@owner%\n名稱: %tt@name%\n錯誤: %tt@error%"
