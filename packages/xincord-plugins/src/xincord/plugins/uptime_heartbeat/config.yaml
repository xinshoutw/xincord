# UptimeHeartbeat: list it under `plugins` in the core config.yaml to enable it.

# Each listener sends an HTTP GET to its url once the bot is ready, then again `interval` seconds
# (from 1) after each attempt, typically to an Uptime Kuma push monitor. %ping% in the url becomes
# the bot's Discord REST ping in milliseconds, or -1 when it cannot be measured. A 404 answer stops
# that listener until the plugin reloads or the bot restarts.
# Example:
#   - url: "https://status.example.com/api/push/<token>?status=up&msg=OK&ping=%ping%"
#     interval: 60
listeners: []
