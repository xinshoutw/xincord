# ChatLogger: list it under `plugins` in the core config.yaml to enable it. It reads the text of
# messages, which Discord's privileged Message Content intent allows: turn that intent on for the
# bot in the Discord developer portal first, or Discord refuses the bot's connection.

# true: store the messages of every channel the bot can read, so that the edits and deletions in a
# channel that a listen channel starts to detect are logged at once. false: store only the messages
# of the channels that a listen channel detects.
log_all: true

# How many days a message's text is kept, 1 to 3650; 1826 days are 5 years. Edits and deletions of
# older messages are not logged.
retention_days: 1826

# The stored messages are kept in files under data/ChatLogger/, in the bot's data directory (the
# data volume under compose). When the newest file reaches this size in MiB (1 MiB is 1,048,576
# bytes), 1 to 65536, a new file starts; a file whose messages are all older than retention_days is
# deleted.
max_file_size_mb: 256
