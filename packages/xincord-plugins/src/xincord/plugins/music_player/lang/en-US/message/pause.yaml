# https://message.style/app/editor/share/ZYUGtETT
embeds:
  - author:
      name: "%music_player@song_author_name%"
    title:
      text: "%music_player@song_name%"
      url: "%music_player@song_url%"

    thumbnail_url: "%music_player@song_thumbnail_url%"

    footer:
      text: "Requested by %music_player@song_requester_username%"
      icon_url: "%music_player@song_requester_avatar_url%"

    fields:
      - name: ""
        value: "%music_player@song_duration%"

    color_code: "%music_player@player_current_color%"

components:
  - !ButtonsComponent
    buttons:
      - uid:
          action: "previous"
        style: 2
        disabled: false
        emoji:
          formatted: "%music_player@media_previous_emoji%"

      - uid:
          action: "pause-resume"
        style: 2
        disabled: false
        emoji:
          formatted: "%music_player@media_pause_resume_emoji%"

      - uid:
          action: "skip"
        style: 2
        disabled: false
        emoji:
          formatted: "%music_player@media_next_emoji%"

      - uid:
          action: "loop"
        style: 2
        disabled: false
        emoji:
          formatted: "%music_player@player_currnet_loop_mode_emoji%"

      - uid:
          action: "disconnect"
        style: 4
        disabled: false
        emoji:
          formatted: "%music_player@media_disconnect_emoji%"
