# The panel's text after a press.
button-join-voice: "❌ You must be in a voice channel to control the music!"
previous-no-song: "❌ No song is playing"
previous-idle: "❌ Cannot read the current playback state"
no-more-songs: "❌ There are no more songs to play"

# Unexpected errors, with or without their text (messages.show_detailed_errors).
command-error: "❌ An error occurred while handling the command: %music_player@error%"
command-error-hidden: "❌ An error occurred while handling the command; please try again later"
button-error: "❌ An error occurred while handling the button: %music_player@error%"
button-error-hidden: "❌ An error occurred while handling the button; please try again later"

# Panels and suggestions; the
# queue's last line is new in xincord.
live: "Live"
live-length: "∞ (live)"
queue-more: "… and %music_player@count% more songs"
current-volume: "Current volume: %music_player@volume%"
