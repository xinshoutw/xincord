# The plugin's texts in English. The plugin fills the %music_player@...% placeholders; their values are
# inserted as written.

# Replies to commands.
join-voice-first: "❌ You must join a voice channel first to use this!"
voice-channel-not-found: "❌ Cannot find your voice channel!"
cannot-connect: "❌ Cannot connect to the voice channel!"
not-connected: "❌ The bot is not connected to any voice channel!"
play-join-voice-first: "❌ You must join a voice channel first to play music!"
no-connect-permission: "❌ The bot has no permission to connect to that voice channel!"
empty-query: "❌ Please give the name or the URL of the song to play!"
empty-playlist: "❌ The playlist is empty!"
no-matches: "❌ No matching song found: %music_player@query%"
load-failed: "❌ The song could not be loaded: %music_player@error%"
nothing-playing: "❌ No song is playing right now!"
already-paused: "⏸️ The song is already paused!"
already-playing: "▶️ The song is already playing!"
skip-too-many: "❌ You can skip at most %music_player@count% songs!"
skipped-to-end: "⏭️ Skipped; the playlist has ended"
shuffle-join-voice: "❌ You must be in a voice channel to use this command!"
shuffle-too-few: "❌ The playlist does not have enough songs to shuffle! (at least 2)"
shuffled: "🔀 Shuffled the playlist: %music_player@count% songs."

# New in xincord: the node cannot be reached, and the history of 240 songs is full.
node-unavailable: "❌ The music server is unavailable; please try again later"
queue-full: "❌ The playlist is full; no more songs can be added!"
