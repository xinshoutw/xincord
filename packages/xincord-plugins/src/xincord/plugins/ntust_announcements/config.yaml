# NtustAnnouncements: list it under `plugins` in the core config.yaml to enable it. Once the bot is
# ready, it reads the events feed of bulletin (https://bulletin.ntust.org), which polls NTUST's
# boards and rewrites their announcements, at once, then `poll-interval` seconds after each read.
# Each new announcement on a board below goes to the board's channel: bulletin's rewrite under the
# title link, with its attachments, or the title link alone when the rewrite is not ready within
# `rendition-wait` seconds. The first read starts at the feed's end, so nothing older is posted. A
# reload applies changes to this file.

# bulletin's API: an http or https URL without user info, a query or a fragment.
api-url: "https://bulletin.ntust.org/api/v1"

# Seconds between the feed's reads, from 30. bulletin polls each board on its own schedule, from
# every 5 minutes to once a day.
poll-interval: 60

# Seconds that a new announcement waits for its rewrite, from 0 to 86400; then it is posted as its
# title link.
rendition-wait: 3600

# The boards. `name` names the board in the logs; `board` is bulletin's key for it, `<site>-<board>`
# such as 1053-1436, or `<site>` for every board of a site (https://bulletin.ntust.org/api/v1/sites
# lists them); `channel-id` is the channel that gets its posts, 0 until you set one; `title-prefix`,
# when set, keeps the titles that start with it. An announcement on several boards that share a
# channel is posted there once.
boards:
  # 學生宿舍公告
  - name: STUDENT_DORMITORY
    board: "1053-1436"
    channel-id: 0
