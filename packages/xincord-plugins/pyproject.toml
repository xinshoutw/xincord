[project]
name = "xincord-plugins"
version = "0.1.0"
description = "The official xincord plugins."
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["xincord"]

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "xincord.plugins"
