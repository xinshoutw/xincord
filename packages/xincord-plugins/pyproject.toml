[project]
name = "xincord-plugins"
version = "0.1.0"
description = "The official xincord plugins."
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["aiohttp>=3.14.4", "xincord"]

# One entry point per plugin, named after the plugin (v3's name unless the owner renamed it); the
# core config's `plugins` list uses it.
[project.entry-points."xincord.plugins"]
Example = "xincord.plugins.example"
Calculator = "xincord.plugins.calculator"
AutoRole = "xincord.plugins.auto_role"
BotInfo = "xincord.plugins.bot_info"
CustomCommands = "xincord.plugins.custom_commands"
WelcomeGoodbye = "xincord.plugins.welcome_goodbye"
IntervalPusher = "xincord.plugins.interval_pusher"
Feedbacker = "xincord.plugins.feedbacker"
Economy = "xincord.plugins.economy"
DynamicVoiceChannel = "xincord.plugins.dynamic_voice_channel"
VoiceLogger = "xincord.plugins.voice_logger"
ChatLogger = "xincord.plugins.chat_logger"
Giveaway = "xincord.plugins.giveaway"

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "xincord.plugins"
