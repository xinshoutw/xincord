[project]
name = "xincord-plugins"
version = "0.1.0"
description = "The official xincord plugins."
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["aiohttp>=3.14.4", "xincord"]

# One entry point per plugin, named after the v3 plugin; the core config's `plugins` list uses it.
[project.entry-points."xincord.plugins"]
_Example = "xincord.plugins.example"
BasicCalculator = "xincord.plugins.basic_calculator"
AutoRole = "xincord.plugins.auto_role"
BotInfo = "xincord.plugins.bot_info"
SimpleCommand = "xincord.plugins.simple_command"
WelcomeByeGuild = "xincord.plugins.welcome_bye_guild"
IntervalPusher = "xincord.plugins.interval_pusher"
Feedbacker = "xincord.plugins.feedbacker"
Economy = "xincord.plugins.economy"

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "xincord.plugins"
