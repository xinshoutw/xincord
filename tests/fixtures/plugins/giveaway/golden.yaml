# The translated payload of the guild command (Register.kt and register.yaml); keys that are not
# listed here are not compared. 8 is the Administrator permission.
commands:
  - type: 1
    name: "create-giveaway"
    description: "Create a giveaway with step-by-step setup"
    default_member_permissions: 8
    name_localizations: {"en-US": "create-giveaway", "zh-TW": "建立抽獎"}
    description_localizations:
      {"en-US": "Create giveaway with step-by-step builder", "zh-TW": "使用步驟表單建立抽獎"}
    options: []

# The builder's four rows of buttons (message/create-giveaway.yaml): their sub-actions, styles
# and labels per locale.
builder:
  sub-actions:
    - ["set-title", "set-description", "set-end-time"]
    - ["add-prize", "remove-prize", "toggle-duplicate-policy"]
    - ["set-sponsor", "set-thumbnail"]
    - ["confirm-create", "cancel"]
  styles: [[1, 1, 1], [3, 2, 2], [2, 2], [3, 4]]
  labels:
    en-US:
      - ["Set Title", "Set Description", "Set End Time"]
      - ["Add Prize", "Remove Last Prize", "Toggle Winner Policy"]
      - ["Set Sponsor", "Set Thumbnail"]
      - ["Confirm Create", "Cancel"]
    zh-TW:
      - ["設定標題", "設定說明", "設定結束時間"]
      - ["新增獎品", "刪除最後獎品", "切換中獎限制"]
      - ["設定主辦/贊助", "設定縮圖"]
      - ["確認建立", "取消"]

