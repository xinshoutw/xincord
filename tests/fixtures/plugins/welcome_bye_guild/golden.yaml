# Golden data for the WelcomeByeGuild tests. The text is v3's, from
# XsDiscordBotKt@3a59607:Plugins/WelcomeByeGuild/src/main/resources/lang/.

# Each command reply per locale, with the channel general (5) as the chosen channel and as the
# previous one.
replies:
  en-US:
    guild-only: "This command can only be used in a guild."
    no-permission: "You need administrator permission to use this command."
    invalid-channel: "Unable to read a valid text channel. Please choose the `channel` option again."
    welcome-bind-success: "Welcome channel has been bound to <#5> (general)."
    welcome-bind-already: "Welcome channel is already <#5>; no update is needed."
    welcome-unbind-success: "Welcome channel unbound successfully (previous: <#5>)."
    welcome-unbind-empty: "No welcome channel is currently bound."
    bye-bind-success: "Leave channel has been bound to <#5> (general)."
    bye-bind-already: "Leave channel is already <#5>; no update is needed."
    bye-unbind-success: "Leave channel unbound successfully (previous: <#5>)."
    bye-unbind-empty: "No leave channel is currently bound."
  zh-TW:
    guild-only: "此指令只能在伺服器內使用。"
    no-permission: "你需要管理員權限才能使用此指令。"
    invalid-channel: "無法讀取文字頻道，請重新選擇 `channel` 參數。"
    welcome-bind-success: "已綁定歡迎頻道到 <#5>（general）。"
    welcome-bind-already: "歡迎頻道已經是 <#5>，不需重複綁定。"
    welcome-unbind-success: "已解除歡迎頻道綁定（原頻道：<#5>）。"
    welcome-unbind-empty: "目前尚未綁定歡迎頻道。"
    bye-bind-success: "已綁定離開訊息頻道到 <#5>（general）。"
    bye-bind-already: "離開訊息頻道已經是 <#5>，不需重複綁定。"
    bye-unbind-success: "已解除離開訊息頻道綁定（原頻道：<#5>）。"
    bye-unbind-empty: "目前尚未綁定離開訊息頻道。"

# The welcome and bye embeds per locale for alice (global name Alice, ID 1, avatar alice.png)
# in guild (icon.png, 42 members, rules channel 6), as Embed.to_dict() without "type" and "flags".
# The zh-TW texts hold the two corrected typos: the welcome's last line and the bye's
# description.
welcome:
  en-US:
    author: {name: "guild", icon_url: "https://cdn.example/icon.png"}
    title: "🎉 Welcome Alice joined us"
    description: "Nice to meet you Alice!\nYou are the **#42** member of this server.\nPlease read the rules: <#6>\nDon't be shy!\n"
    thumbnail: {url: "https://cdn.example/alice.png"}
    color: 5763719
  zh-TW:
    author: {name: "guild", icon_url: "https://cdn.example/icon.png"}
    title: "🎉 歡迎 Alice 加入伺服器！"
    description: "很高興在這裡看到你 <@1>！\n你是我們的第 **42** 位成員！\n請先閱讀規則：<#6>\n也不妨到處看看喔！\n"
    thumbnail: {url: "https://cdn.example/alice.png"}
    color: 5763719
bye:
  en-US:
    author: {name: "guild", icon_url: "https://cdn.example/icon.png"}
    title: "😢 Alice left"
    description: "Hope we can see each other again in the future...\n"
    thumbnail: {url: "https://cdn.example/alice.png"}
    color: 15548997
  zh-TW:
    author: {name: "guild", icon_url: "https://cdn.example/icon.png"}
    title: "😢 Alice 離開了我們"
    description: "但願我們能在未來的道路上相見...\n"
    thumbnail: {url: "https://cdn.example/alice.png"}
    color: 15548997
