# Golden data for the VoiceLogger tests. The text is v3's, from
# XsDiscordBotKt@3a59607:Plugins/VoiceLogger/src/main/resources/lang/.

# The settings menu of channel voice-log (5) per locale, in the block mode with the allow list [30]
# and an empty block list, as Embed.to_dict() without "type" and "flags", and its buttons as
# (label, style, custom ID). The core trims the list's final newline, as JDA did.
menu:
  en-US:
    embed:
      author: {name: "Voice Log"}
      title: "☛ voice-log's Channel Setting"
      footer: {text: "❖ ORDERLY SERVER ❖"}
      fields:
        - {name: "Channel Mode", value: "<BLOCK>", inline: false}
        - {name: "Allowlist Channels", value: "<#30> (`30`)", inline: false}
        - {name: "Blocklist Channels", value: "Empty", inline: false}
    buttons:
      - ["Toggle Mode", 1, "voice_logger:1:a=toggle_btn"]
      - ["Modify Allowlist", 3, "voice_logger:1:a=modify_allow_btn"]
      - ["Modify Blocklist", 2, "voice_logger:1:a=modify_block_btn"]
      - ["Delete", 4, "voice_logger:1:a=delete_btn"]
  zh-TW:
    embed:
      author: {name: "語音日誌"}
      title: "☛ voice-log 的頻道設定"
      footer: {text: "❖ ORDERLY SERVER ❖"}
      fields:
        - {name: "頻道模式", value: "<BLOCK>", inline: false}
        - {name: "白名單頻道", value: "<#30> (`30`)", inline: false}
        - {name: "黑名單頻道", value: "無", inline: false}
    buttons:
      - ["切換模式", 1, "voice_logger:1:a=toggle_btn"]
      - ["設定白名單", 3, "voice_logger:1:a=modify_allow_btn"]
      - ["設定黑名單", 2, "voice_logger:1:a=modify_block_btn"]
      - ["刪除", 4, "voice_logger:1:a=delete_btn"]
