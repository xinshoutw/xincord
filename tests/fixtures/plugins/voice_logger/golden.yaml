# Golden data for the VoiceLogger tests. The text is v3's, from
# XsDiscordBotKt@3a59607:Plugins/VoiceLogger/src/main/resources/lang/.

# The settings menu of channel voice-log (5) per locale, in the block mode with the allow list [30]
# and an empty block list, as Embed.to_dict() without "type" and "flags", and its buttons as
# (label, style, custom ID). The core trims the list's final newline, as JDA did.
menu:
  en-US:
    embed:
      author: {name: "Voice Log"}
      title: "☛ voice-log's Channel Setting"
      footer: {text: "❖ ORDERLY SERVER ❖"}
      fields:
        - {name: "Channel Mode", value: "<BLOCK>", inline: false}
        - {name: "Allowlist Channels", value: "<#30> (`30`)", inline: false}
        - {name: "Blocklist Channels", value: "Empty", inline: false}
    buttons:
      - ["Toggle Mode", 1, "voice_logger:1:a=toggle_btn"]
      - ["Modify Allowlist", 3, "voice_logger:1:a=modify_allow_btn"]
      - ["Modify Blocklist", 2, "voice_logger:1:a=modify_block_btn"]
      - ["Delete", 4, "voice_logger:1:a=delete_btn"]
  zh-TW:
    embed:
      author: {name: "語音日誌"}
      title: "☛ voice-log 的頻道設定"
      footer: {text: "❖ ORDERLY SERVER ❖"}
      fields:
        - {name: "頻道模式", value: "<BLOCK>", inline: false}
        - {name: "白名單頻道", value: "<#30> (`30`)", inline: false}
        - {name: "黑名單頻道", value: "無", inline: false}
    buttons:
      - ["切換模式", 1, "voice_logger:1:a=toggle_btn"]
      - ["設定白名單", 3, "voice_logger:1:a=modify_allow_btn"]
      - ["設定黑名單", 2, "voice_logger:1:a=modify_block_btn"]
      - ["刪除", 4, "voice_logger:1:a=delete_btn"]

# The select menu that replaces the menu when a list's button is pressed (the message keeps no
# embed): its placeholder per locale, its limits and its channel types (2 voice, 4 category).
select:
  en-US: "choose channels, categories or search here"
  zh-TW: "選擇頻道、類別或在此搜尋"
select_limits: {min_values: 1, max_values: 25, channel_types: [2, 4]}

# The embed that replaces the menu of channel voice-log once its settings are deleted.
delete:
  en-US:
    author: {name: "Voice Log"}
    title: "☛ voice-log's Channel Setting"
    description: "Deleted Successfully"
    footer: {text: "❖ ORDERLY SERVER ❖"}
    color: 65535
  zh-TW:
    author: {name: "語音日誌"}
    title: "☛ voice-log 的頻道設定"
    description: "刪除完成"
    footer: {text: "❖ ORDERLY SERVER ❖"}
    color: 65535

# The translated payload of the guild command; keys that are not listed here are not compared. 8 is
# the Administrator permission and option type 1 a subcommand. The texts come from v3's
# Register.kt and register.yaml.
commands:
  - type: 1
    name: "voice-logger"
    description: "commands about voice logger"
    default_member_permissions: 8
    name_localizations: {"en-US": "voice-logger", "zh-TW": "語音紀錄"}
    description_localizations: {"en-US": "commands about voice logger", "zh-TW": "有關語音紀錄的指令"}
    options:
      - type: 1
        name: "setting"
        description: "set voice log in this channel"
        name_localizations: {"en-US": "setting", "zh-TW": "設定"}
        description_localizations: {"en-US": "set voice log in this channel", "zh-TW": "設定語音紀錄在此頻道"}
        options: []

