# Golden data for the Feedbacker tests. The text is v3's, from
# XsDiscordBotKt@3a59607:Plugins/Feedbacker/src/main/resources/, unless noted.

# v3's bundled config.yaml, as written (without a final newline).
v3_config: "enabled: false\n\nform_no_permission: \"您沒有權限！\"\nform_not_you: \"這個表單不是為你建立的！\"\nform_success: \"建立成功\""

# The replies of the bundled config.yaml: v3's three and the two new failure replies.
config:
  form_no_permission: "您沒有權限！"
  form_not_you: "這個表單不是為你建立的！"
  form_success: "建立成功"
  form_failure: "建立失敗"
  form_submit_failure: "送出失敗"

# %fb_stars% for each star count, as v3's "★ ".repeat(n) + "☆ ".repeat(5 - n) wrote it.
fb_stars:
  0: "☆ ☆ ☆ ☆ ☆ "
  1: "★ ☆ ☆ ☆ ☆ "
  2: "★ ★ ☆ ☆ ☆ "
  3: "★ ★ ★ ☆ ☆ "
  4: "★ ★ ★ ★ ☆ "
  5: "★ ★ ★ ★ ★ "

# The prompt that asks for a rating, per locale, as Embed.to_dict() without "type" and "flags",
# above five gray buttons labeled with one to five stars.
ask:
  en-US:
    title: "Please provide a rating and review"
    footer: {text: "❖ ORDERLY SERVER ❖"}
  zh-TW:
    title: "請給予星等與評價"
    footer: {text: "❖ ORDERLY SERVER ❖"}
star_labels: ["★", "★★", "★★★", "★★★★", "★★★★★"]

# The feedback modal per locale: its title and its paragraph input's label and placeholder.
modal:
  en-US:
    title: "How was today's service? :D"
    label: "Please briefly describe your feedback"
    placeholder: "Awesome!"
  zh-TW:
    title: "您覺得今天的服務怎麼樣呢？ :D"
    label: "請簡述評價內容"
    placeholder: "超讚"

# The review per guild locale, for alice (ID 7, no avatar) rating three stars with "great", as
# Embed.to_dict() without "type" and "flags"; the color is #60C0C0.
review:
  en-US:
    title: "☛ New Review from alice"
    description: "★ ★ ★ ☆ ☆ "
    thumbnail: {url: "https://cdn.example/default.png"}
    color: 6340800
    footer: {text: "❖ ORDERLY SERVER ❖"}
    fields: [{name: "Review Content", value: "great", inline: false}]
  zh-TW:
    title: "☛ 來自 alice 的新評價"
    description: "★ ★ ★ ☆ ☆ "
    thumbnail: {url: "https://cdn.example/default.png"}
    color: 6340800
    footer: {text: "❖ ORDERLY SERVER ❖"}
    fields: [{name: "評價內容", value: "great", inline: false}]

# The guild command payload, with v3's description and the localizations of register.yaml; no
# default member permissions, as v3 checked Administrator when the command ran.
command:
  type: 1
  name: "feedbacker"
  description: "Create a feedback form for a member"
  nsfw: false
  default_member_permissions: null
  options:
    - type: 6
      name: "member"
      description: "Specify the member"
      required: true
      name_localizations: {"en-US": "member", "zh-TW": "member"}
      description_localizations: {"en-US": "who", "zh-TW": "誰"}
    - type: 7
      name: "submit-channel"
      description: "Specify the submit channel"
      required: true
      channel_types: [0]
      name_localizations: {"en-US": "submit-channel", "zh-TW": "submit-channel"}
      description_localizations: {"en-US": "where to send the feedback result", "zh-TW": "回饋結果要送到哪個頻道"}
  name_localizations: {"en-US": "feedbacker", "zh-TW": "評價表單"}
  description_localizations: {"en-US": "create a channel for member feedback", "zh-TW": "為使用者建立一個評價選單"}
