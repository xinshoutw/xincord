# v3's bundled config.yaml, as written (without a final newline).
v3_config: "enabled: false\n\nform_no_permission: \"您沒有權限！\"\nform_not_you: \"這個表單不是為你建立的！\"\nform_success: \"建立成功\""

# The replies of the bundled config.yaml: v3's three and the two new failure replies.
config:
  form_no_permission: "您沒有權限！"
  form_not_you: "這個表單不是為你建立的！"
  form_success: "建立成功"
  form_failure: "建立失敗"
  form_submit_failure: "送出失敗"

# %fb_stars% for each star count, as v3's "★ ".repeat(n) + "☆ ".repeat(5 - n) wrote it.
fb_stars:
  0: "☆ ☆ ☆ ☆ ☆ "
  1: "★ ☆ ☆ ☆ ☆ "
  2: "★ ★ ☆ ☆ ☆ "
  3: "★ ★ ★ ☆ ☆ "
  4: "★ ★ ★ ★ ☆ "
  5: "★ ★ ★ ★ ★ "

# The prompt that asks for a rating, per locale, as Embed.to_dict() without "type" and "flags",
# above five gray buttons labeled with one to five stars.
ask:
  en-US:
    title: "Please provide a rating and review"
    footer: {text: "❖ ORDERLY SERVER ❖"}
  zh-TW:
    title: "請給予星等與評價"
    footer: {text: "❖ ORDERLY SERVER ❖"}
star_labels: ["★", "★★", "★★★", "★★★★", "★★★★★"]
