# Golden data for the ChatLogger tests. The text is v3's, from
# XsDiscordBotKt@3a59607:Plugins/ChatLogger/src/main/resources/lang/.

# The settings menu of channel chat-log (5) per locale, in the block mode with the allow list [30]
# and an empty block list, as Embed.to_dict() without "type" and "flags", and its buttons as
# (label, style, custom ID). The core trims the list's final newline, as JDA did.
menu:
  en-US:
    embed:
      author: {name: "Message Log"}
      title: "☛ chat-log's Channel Setting"
      footer: {text: "❖ ORDERLY SERVER ❖"}
      fields:
        - {name: "Channel Mode", value: "<BLOCK>", inline: false}
        - {name: "Allowlist Channels", value: "<#30> (`30`)", inline: false}
        - {name: "Blocklist Channels", value: "Empty", inline: false}
    buttons:
      - ["Toggle Mode", 1, "chat_logger:1:a=toggle_btn"]
      - ["Modify Allowlist", 3, "chat_logger:1:a=modify_allow_btn"]
      - ["Modify Blocklist", 2, "chat_logger:1:a=modify_block_btn"]
      - ["Delete", 4, "chat_logger:1:a=delete_btn"]
  zh-TW:
    embed:
      author: {name: "訊息日誌"}
      title: "☛ chat-log 的頻道設定"
      footer: {text: "❖ ORDERLY SERVER ❖"}
      fields:
        - {name: "頻道模式", value: "<BLOCK>", inline: false}
        - {name: "白名單頻道", value: "<#30> (`30`)", inline: false}
        - {name: "黑名單頻道", value: "無", inline: false}
    buttons:
      - ["切換模式", 1, "chat_logger:1:a=toggle_btn"]
      - ["設定白名單", 3, "chat_logger:1:a=modify_allow_btn"]
      - ["設定黑名單", 2, "chat_logger:1:a=modify_block_btn"]
      - ["刪除", 4, "chat_logger:1:a=delete_btn"]

# The select menu that replaces the menu when a list's button is pressed (the message keeps no
# embed): its placeholder per locale, its limits and v3's channel types in v3's order (text, voice,
# category, announcement, stage, forum, media, and the three thread types).
select:
  en-US: "choose channels, categories or search here"
  zh-TW: "選擇頻道、類別或在此搜尋"
select_limits:
  min_values: 1
  max_values: 25
  channel_types: [0, 2, 4, 5, 13, 15, 16, 10, 11, 12]

# The embed that replaces the menu of channel chat-log once its settings are deleted.
delete:
  en-US:
    author: {name: "Message Log"}
    title: "☛ chat-log's Channel Setting"
    description: "Deleted Successfully"
    footer: {text: "❖ ORDERLY SERVER ❖"}
    color: 65535
  zh-TW:
    author: {name: "訊息日誌"}
    title: "☛ chat-log 的頻道設定"
    description: "刪除完成"
    footer: {text: "❖ ORDERLY SERVER ❖"}
    color: 65535

# The translated payload of the guild command; keys that are not listed here are not compared. 8 is
# the Administrator permission and option type 1 a subcommand. The texts come from v3's
# Register.kt and register.yaml.
commands:
  - type: 1
    name: "chat-logger"
    description: "commands about chat logger"
    default_member_permissions: 8
    name_localizations: {"en-US": "chat-logger", "zh-TW": "訊息紀錄"}
    description_localizations: {"en-US": "commands about chat logger", "zh-TW": "有關訊息紀錄的指令"}
    options:
      - type: 1
        name: "setting"
        description: "set chat log in this channel"
        name_localizations: {"en-US": "setting", "zh-TW": "設定"}
        description_localizations: {"en-US": "set chat log in this channel", "zh-TW": "設定訊息紀錄在此頻道"}
        options: []

# The update embed per locale: member 7 (no avatar: discord.py's default one) edits message 100
# in channel 30 of category 20, guild 10, from "hello" to "hi". The core trims the change count's
# newlines, as JDA did; #D0D000 is 13684736.
update:
  en-US:
    title: "☛ Message Updated"
    url: "https://discord.com/channels/10/30/100"
    thumbnail: {url: "https://cdn.discordapp.com/embed/avatars/0.png"}
    color: 13684736
    footer: {text: "❖ ORDERLY SERVER ❖"}
    fields:
      - {name: "`Member`", value: "<@7>", inline: false}
      - {name: "`Category`", value: "<#20>", inline: false}
      - {name: "`Channel`", value: "<#30>", inline: false}
      - {name: "`Change Count`", value: "1", inline: false}
      - {name: "`--> Before <--`", value: "hello", inline: false}
      - {name: "`==> After <==`", value: "hi", inline: false}
  zh-TW:
    title: "☛ 變更訊息"
    url: "https://discord.com/channels/10/30/100"
    thumbnail: {url: "https://cdn.discordapp.com/embed/avatars/0.png"}
    color: 13684736
    footer: {text: "❖ ORDERLY SERVER ❖"}
    fields:
      - {name: "`類別`", value: "<#20>", inline: false}
      - {name: "`頻道`", value: "<#30>", inline: false}
      - {name: "`使用者`", value: "<@7>", inline: false}
      - {name: "`變更次數`", value: "1", inline: false}
      - {name: "`--> 變更前 <--`", value: "hello", inline: false}
      - {name: "`==> 變更後 <==`", value: "hi", inline: false}
