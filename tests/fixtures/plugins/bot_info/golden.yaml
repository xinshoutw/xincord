# Golden data for the BotInfo tests: the bundled texts, with the source field (decision C3).

# The reply's embed while the bot is in guilds of 3 and 4 members, with the default config, as
# Embed.to_dict() without "type" and "flags".
reply:
  en-US:
    author: {name: "Info Query", icon_url: "https://i.imgur.com/a7z4ch2.png"}
    title: "☛ ORDERLY BOT's INFORMATION"
    footer: {text: "❖ ORDERLY SERVER ❖"}
    color: 65535
    fields:
      - {name: "Server Counts", value: "2", inline: false}
      - {name: "Member Counts", value: "7", inline: false}
      - {name: "Source Code", value: "https://github.com/xinshoutw/xincord", inline: false}
  zh-TW:
    author: {name: "狀態查詢", icon_url: "https://i.imgur.com/a7z4ch2.png"}
    title: "☛ 序之徒的資訊"
    footer: {text: "❖ ORDERLY SERVER ❖"}
    color: 65535
    fields:
      - {name: "伺服器總數", value: "2", inline: false}
      - {name: "成員總數", value: "7", inline: false}
      - {name: "原始碼", value: "https://github.com/xinshoutw/xincord", inline: false}

# The translated payload of /bot-info; keys that are not listed here are not compared. The contexts
# (guilds and the bot's DMs) and the integration types (guild installs) are set explicitly.
command:
  type: 1
  name: "bot-info"
  description: "show about the bot data"
  nsfw: false
  default_member_permissions: null
  contexts: [0, 1]
  integration_types: [0]
  options: []
  name_localizations: {en-US: "bot-info", zh-TW: "機器人資訊"}
  description_localizations: {en-US: "show about this Bot", zh-TW: "顯示有關機器人的資訊"}
