archive:
  start: "【Thread 開始】\n作者: Bobby\n名稱: question\n開始時間: 2026-02-28 01:00:00"
  end: "【Thread 結束】\n作者: Bobby\n名稱: question\n最後一則訊息時間: 2026-02-28 01:45:00"
  end-without-messages: "【Thread 結束】\n作者: Bobby\n名稱: question\n最後一則訊息時間: 無訊息"
  start-by-id: "【Thread 開始】\n作者: 8\n名稱: question\n開始時間: 2026-02-28 01:00:00"
  end-by-id: "【Thread 結束】\n作者: 8\n名稱: question\n最後一則訊息時間: 2026-02-28 01:45:00"
