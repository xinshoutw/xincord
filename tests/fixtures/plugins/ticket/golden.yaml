# v3's ID shapes (inventory section 4): the fields that IDS.parse reads and the new ID that the core
# writes. v3 wrote user IDs in lowercase hex: 112210f47de98115 is 1234567890123456789.
ids:
  - v3: "ticket@a:create;b:modify-author"
    fields: {action: "create", sub_action: "modify-author"}
    new: "ticket:1:a=create;b=modify-author"
  - v3: "ticket@a:create;b:back"
    fields: {action: "create", sub_action: "back"}
    new: "ticket:1:a=create;b=back"
  - v3: "ticket@a:create;b:modify-btn-color-submit;c:3"
    fields: {action: "create", sub_action: "modify-btn-color-submit", color_index: "3"}
    new: "ticket:1:a=create;b=modify-btn-color-submit;c=3"
  - v3: "ticket@a:create;b:modify-category"
    fields: {action: "create", sub_action: "modify-category"}
    new: "ticket:1:a=create;b=modify-category"
  - v3: "ticket@a:create;b:modify-admin"
    fields: {action: "create", sub_action: "modify-admin"}
    new: "ticket:1:a=create;b=modify-admin"
  - v3: "ticket@b:prev"  # v3's preview button, without an action (B1)
    fields: {sub_action: "prev"}
    new: "ticket:1:b=prev"
  - v3: "ticket@a:create;b:modify-embed-color"
    fields: {action: "create", sub_action: "modify-embed-color"}
    new: "ticket:1:a=create;b=modify-embed-color"
  - v3: "ticket@a:create;b:modify-btn-content"  # v3's zh-TW button modal (B2)
    fields: {action: "create", sub_action: "modify-btn-content"}
    new: "ticket:1:a=create;b=modify-btn-content"
  - v3: "ticket@a:press;f:0"
    fields: {action: "press", btn_index: "0"}
    new: "ticket:1:a=press;f=0"
  - v3: "ticket@a:press;e:1290000000000000001;f:1"
    fields: {action: "press", msg_id: "1290000000000000001", btn_index: "1"}
    new: "ticket:1:a=press;e=1290000000000000001;f=1"
  - v3: "ticket@a:submit;e:1290000000000000001;f:0"
    fields: {action: "submit", msg_id: "1290000000000000001", btn_index: "0"}
    new: "ticket:1:a=submit;e=1290000000000000001;f=0"
  - v3: "ticket@a:lock;d:112210f47de98115;e:1290000000000000001;f:0"
    fields: {action: "lock", user_id: "1234567890123456789", msg_id: "1290000000000000001", btn_index: "0"}
    new: "ticket:1:a=lock;d=1234567890123456789;e=1290000000000000001;f=0"
  - v3: "ticket@a:unlock;d:112210f47de98115;e:1290000000000000001;f:0"
    fields: {action: "unlock", user_id: "1234567890123456789", msg_id: "1290000000000000001", btn_index: "0"}
    new: "ticket:1:a=unlock;d=1234567890123456789;e=1290000000000000001;f=0"
  - v3: "ticket@a:save;d:112210f47de98115;e:1290000000000000001;f:0"
    fields: {action: "save", user_id: "1234567890123456789", msg_id: "1290000000000000001", btn_index: "0"}
    new: "ticket:1:a=save;d=1234567890123456789;e=1290000000000000001;f=0"
  - v3: "ticket@a:delete;d:112210f47de98115;e:1290000000000000001;f:0"
    fields: {action: "delete", user_id: "1234567890123456789", msg_id: "1290000000000000001", btn_index: "0"}
    new: "ticket:1:a=delete;d=1234567890123456789;e=1290000000000000001;f=0"
  - v3: "ticket@a:save;b:select-channel;d:112210f47de98115;e:1290000000000000001;f:0"
    fields: {action: "save", sub_action: "select-channel", user_id: "1234567890123456789", msg_id: "1290000000000000001", btn_index: "0"}
    new: "ticket:1:a=save;b=select-channel;d=1234567890123456789;e=1290000000000000001;f=0"
  - v3: "ticket@f:0"  # before v3's b4d10e2: no action, no answer
    fields: {btn_index: "0"}
    new: "ticket:1:f=0"

