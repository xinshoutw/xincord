# Golden data for the Ticket tests. The texts are v3's, from
# XsDiscordBotKt@3a59607:Plugins/Ticket/src/main/ (its Kotlin code and its resources), unless noted.

# Texts that v3 wrote in Ticket.kt (zh-TW) and their en-US texts (new).
texts:
  en-US:
    not-found: "Error (the ticket settings were not found; they may have been deleted)"
    lock: "Close"
  zh-TW:
    not-found: "錯誤 (找不到 Ticket 設定資料，可能已被刪除)"
    lock: "關閉"
    unlock: "開啟"
    save: "儲存對話"
    delete: "刪除"
    # reply.go-to-channel with the channel `%tt@thread%`, inserted as written.
    go-to-placeholder: "請到此頻道 %tt@thread% 並等待人員回覆繼續!"

# A guild's document as v3's Moshi wrote it (compact, its field order), after the inventory's
# example: two buttons on one panel, the second with its own category. Snowflakes above 2^53 must
# stay exact.
document: '{"1290000000000000001":[{"reasonTitle":"有任何可以幫助的問題嗎~","adminIds":[1280000000000000002],"categoryId":0},{"reasonTitle":"退款","adminIds":[],"categoryId":1270000000000000003}]}'
refund: "退款"

# The guild commands (command/Register.kt:29-43, lang/*/register.yaml), as discord.py's payload
# lists them; options are compared by the keys listed here.
commands:
  - type: 1
    name: "create-ticket"
    description: "create custom reason of ticket"
    default_member_permissions: 8
    name_localizations: {"en-US": "create-ticket", "zh-TW": "建立客服按鈕"}
    description_localizations: {"en-US": "Create a message with ticket button.", "zh-TW": "建立具有客服按鈕的訊息"}
    options: []
  - type: 1
    name: "add-ticket"
    description: "create custom reason of ticket in the text-channel"
    default_member_permissions: 8
    name_localizations: {"en-US": "add-ticket", "zh-TW": "從已有訊息添加客服按鈕"}
    description_localizations: {"en-US": "Limit 1 Action, 5 buttons at most.", "zh-TW": "第一行 ActionRow 至多 5 個按鈕"}
    options:
      - type: 3
        name: "message_id"
        description: "for adding extra button"
        required: true
        name_localizations: {"en-US": "message-id", "zh-TW": "訊息id"}
        description_localizations: {"en-US": "The message id which button will be added.", "zh-TW": "要添加按鈕的訊息Id"}

# The builder's rows of buttons below the preview button (message/create-ticket.yaml and
# message/add-ticket.yaml): their sub-actions, styles and labels per locale.
builder:
  create-ticket:
    sub-actions:
      - ["modify-author", "modify-content", "modify-category", "modify-color"]
      - ["modify-btn-text", "modify-btn-color", "modify-reason", "modify-admin", "confirm-create"]
    styles:
      - [1, 1, 1, 1]
      - [1, 1, 1, 1, 3]
    labels:
      en-US:
        - ["set author", "set content", "set category", "set color"]
        - ["set btn text", "set btn color", "set ask title", "set allow role", "confirm create"]
      zh-TW:
        - ["設定作者", "設定文字", "設定頻道目錄", "設定顏色"]
        - ["設定按鈕文字", "設定按鈕顏色", "設定詢問標題", "設定允許身分組", "確定建立"]
  add-ticket:
    sub-actions:
      - ["modify-category"]
      - ["modify-btn-text", "modify-btn-color", "modify-reason", "modify-admin", "confirm-create"]
    styles:
      - [1]
      - [1, 1, 1, 1, 3]
    labels:
      en-US:
        - ["set category"]
        - ["set btn text", "set btn color", "set ask title", "set allow role", "confirm create"]
      zh-TW:
        - ["設定頻道目錄"]
        - ["設定按鈕文字", "設定按鈕顏色", "設定詢問標題", "設定允許身分組", "確定建立"]

