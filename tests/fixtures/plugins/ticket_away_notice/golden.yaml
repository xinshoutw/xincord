# Golden data for the TicketAwayNotice tests: the bundled texts, unless noted.

# An operator's config.yaml with an `enabled` key and placeholder IDs, unquoted and quoted.
operator_config:
  unquoted: |
    enabled: true
    guild_id: 111111111111111111
    user_id: 222222222222222222
    prefix:
      - "客服單-"
      - "ticket-"
    delay_millis: 2000
  quoted: |
    enabled: true
    guild_id: "111111111111111111"
    user_id: "222222222222222222"
    prefix:
      - "客服單-"
      - "ticket-"
    delay_millis: 2000

# The bundled notice as Embed.to_dict() gives it, without "type" and "flags": its text and
# footer with an example shop name and channel IDs, the text in the description.
notice:
  author: {name: "範例商店"}
  description: "營業時間參考請看 <#111111111111111111> \n如果老闆沒有馬上回你代表人不在，請等老闆回覆訊息，並且先說出需要購買的商品還有 <#222222222222222222>"
  footer: {text: "❖ ORDERLY SERVER ❖"}

# An operator's notice with the text in the title, with placeholder values and the
# bot's name in the footer, and the embed that it gives for the bot xincord.
operator_notice: |
  embeds:
    - author:
        name: "範例商店"
      title:
        text: "營業時間參考請看 <#111111111111111111> \n如果老闆沒有馬上回你代表人不在，請等老闆回覆訊息，並且先說出需要購買的商品還有 <#222222222222222222>"
      footer:
        text: "❖ %bot_name% ❖"
operator_embed:
  author: {name: "範例商店"}
  title: "營業時間參考請看 <#111111111111111111> \n如果老闆沒有馬上回你代表人不在，請等老闆回覆訊息，並且先說出需要購買的商品還有 <#222222222222222222>"
  footer: {text: "❖ xincord ❖"}

# A channel named after the first prefix, as another ticket system named its channels.
chinese_channel: "客服單-001"
