   <div class="meditor"><p><span style="font-family: 新細明體"><span style="font-size: 10pt"><span style="color: black"><span face=""><span style="font-size: 10pt"><span style="font-family: 新細明體, serif"> </span></span></span></span></span></span></p>

<p><span style="color: black"><span face=""><span style="color: black"><span face="">領獎說明：</span></span></span></span></p>

<p><span style="color: black"><span face=""><span style="color: black"><span face=""></span></span><span style="color: black"><span face="">本校114學年第二</span></span></span></span><span style="color: black"><span face=""><span style="color: black"><span face="">學期網路課程評量已圓滿結束</span></span><span style="color: black"><span face="">，感謝同學的參與。</span></span></span></span></p>

<p><span style="color: black"><span face=""><span style="color: #b22222"><span face="">得獎同學將以電子郵件通知，請務必自行留意中獎訊息，並於<strong>7<span style="color: black"><span face=""><span style="color: #b22222"><span face="">月3日(五)</span></span><span style="color: #b22222"><span face="">日前提供領獎資料</span></span></span></span></strong>，逾期視同放棄得獎資格<strong>。</strong></span></span></span></span></p>

<p><span style="color: black"><span face=""><span style="color: black"><span face="">請同學每學期約於期末考前兩週左右（詳細日期依教務處時程表為依據），記得上網填答；</span></span></span></span></p>

<p><span style="color: black"><span face=""><span style="color: black"><span face="">凡上網填寫評量者，可即時網路查閱成績，謝謝。</span></span></span></span></p>

<p><span style="color: black"><span face="">&nbsp;</span></span></p>
