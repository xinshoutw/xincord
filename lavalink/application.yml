# The Lavalink node that plays MusicPlayer's audio: compose.yaml's lavalink service reads this file.
# Its password is LAVALINK_SERVER_PASSWORD, which compose sets from LAVALINK_PASSWORD in .env; the
# Spotify and YouTube settings come from .env too. Lavalink downloads the plugins below when its container
# starts. https://lavalink.dev/configuration/
server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    # YouTube: search, videos and playlists (lavaplayer's own YouTube source is deprecated). A
    # snapshot of master (2026-09-17), from Lavalink's snapshot repository: 1.18.2's TV client is
    # refused by YouTube (youtube-source #226, fixed in #233). Back to a release that holds it.
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      snapshot: true
    # Spotify links, played from YouTube; its source is off unless SPOTIFY_ENABLED is true.
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false
  server:
    sources:
      youtube: false # deprecated: the youtube plugin replaces it
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: false # any URL: members could make the node fetch addresses on the host's network
      local: false # the node's own files
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

plugins:
  youtube:
    enabled: true
    allowSearch: true # ytsearch:, which MusicPlayer sends for anything that is no link
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # youtube-source's defaults, then TV, the only client that uses the OAuth account: videos that
    # ask the others to sign in play through it.
    clients: [MUSIC, ANDROID_VR, WEB, WEBEMBEDDED, TV]
    oauth: # a spare Google account, from .env (YOUTUBE_OAUTH_*); off by default
      enabled: ${YOUTUBE_OAUTH_ENABLED:false}
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
    # youtube-source no longer solves YouTube's signatures well itself: a yt-cipher server does, by
    # default its author's public one; set YOUTUBE_CIPHER_URL (and _PASSWORD) in .env for your own.
    remoteCipher:
      url: "${YOUTUBE_CIPHER_URL:https://cipher.kikkia.dev/}"
      password: "${YOUTUBE_CIPHER_PASSWORD:}"
  lavasrc:
    providers: # how a Spotify song is found on YouTube
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: ${SPOTIFY_ENABLED:false}
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "${SPOTIFY_COUNTRY_CODE:TW}"

logging:
  request:
    enabled: false # it would log every member's search
  level:
    root: INFO
    lavalink: INFO
    # Its INFO lines name each load's identifier: every member's search and link.
    lavalink.server.player.AudioLoaderRestHandler: WARN
