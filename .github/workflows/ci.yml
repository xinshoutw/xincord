name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: uv sync --locked
      - run: scripts/gate.sh

  image:
    # The image as a release builds it, for the runner's platform only: an update that breaks it
    # fails here, before it merges.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: xincord:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Import every plugin
        run: >-
          docker run --rm --entrypoint python xincord:ci -c "from importlib.metadata import
          entry_points; print(len([p.load() for p in entry_points(group='xincord.plugins')]),
          'plugins imported')"
      - name: Start without connecting
        run: docker run --rm xincord:ci --no-online
